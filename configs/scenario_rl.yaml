# RL scenario configuration.
#
# Reward shape is aligned with COMCOM-S-26-00430 (Section 4.5), adapted
# to a binary action space (DPDK vs USR; horizontal scaling is left for
# a later phase) and to a soft cooldown (the paper uses a hard guard).
#
# This file is consumed by two consumers:
#   1. The RL side (reward weights, observation parameters, training).
#   2. The UpfDigitalTwin's `DigitalTwin` class, which expects nested
#      `traffic`, `upf`, and `upf_switching` blocks. Keeping a single
#      file avoids drift between the two views of "the scenario".

seed: 42

traffic:
  service: "video"
  selected_k: 8
  time_step_minutes: 15
  # Normalization factor: Gbps per 1.0 of normalized forecaster output.
  # Placeholder — override once the forecaster's scaler is known.
  alpha: 1.0

upf:
  qos_budget:
    # Twin's binary `is_safe` thresholds. The reward no longer uses
    # `is_safe` directly; instead it uses a continuous QoS score
    # derived from `delay_us` and `predicted_loss` against these
    # budgets. They are still used as the normalisation base for that
    # score, so the values here matter.
    delay_budget_us: 200.0
    max_loss_pkts_per_interval: 5.0

upf_switching:
  accounting: "sub_step"
  prewarm:
    enabled: false
    standby_power_watts: 0.0

# Initial UPF at episode start. Must be "DPDK" or "USR".
initial_action: "DPDK"

# Discrete action space exposed by SingleSiteUPFEnv.
# Informational; the env hard-codes the same mapping.
action_space:
  type: "Discrete"
  n: 2
  mapping:
    0: "DPDK"
    1: "USR"

# Reward — paper-aligned (COMCOM-S-26-00430, Section 4.5):
#
#   SEC_t  = P_t / max(load_mbps, eps)                  # specific energy (W/Mbps)
#   Q_t    = min(delay_score, loss_score) in [0, 1]     # from twin surrogates
#   L_QoS  = lambda_qos * max(0, tau - Q_t)             # graded QoS penalty
#   L_SW   = c_dpdk if switched->DPDK else c_usr if switched->USR else 0
#   L_CD   = soft cooldown surcharge (our extension)
#
#   reward = -(alpha * SEC_t + L_QoS + L_SW + L_CD)
#
# Magnitudes chosen so PPO sees a real gradient toward USR at low loads
# without being terrified of switching:
#   - per-step DPDK SEC contribution ~0.6-0.8 reward at typical load.
#   - safe-USR SEC contribution      ~0.3-0.5 — USR saves ~0.3/step.
#   - QoS penalty bites at up to lambda_qos * tau = 27 if Q -> 0.
#   - one DPDK switch costs 0.03; one USR switch 0.012.
reward_weights:
  alpha:         100.0    # SEC scaler (paper Table 3: 100)
  lambda_qos:    30.0     # QoS penalty weight (paper: 30)
  tau:           0.90     # QoS compliance target (paper: 0.9)
  c_dpdk:        0.03     # cost of switching INTO DPDK (paper: 0.03)
  c_usr:         0.012    # cost of switching INTO USR (paper: 0.012)
  cooldown_period: 4      # minimum-dwell window, in 15-min steps
  cooldown_cost:   0.5    # extra penalty for switching inside the window

# Observation construction. Matches the paper's "history-augmented"
# schema (Section 4.3) — current load + the last W actual loads +
# 1-step forecast + minimal deployment context. Multi-step forecast
# is intentionally NOT used: we decide for one step at a time.
observation:
  history_window: 8       # number of past actual loads to include

# Training placeholders. The trainer CLI overrides these.
training:
  total_timesteps: 200000
  n_envs: 1
  algorithm: "PPO"

notes: |
  Binary single-site env. Reward & observation are aligned with the
  paper's design adapted to a binary action space. Multi-instance
  scaling (paper's k > 1 USR) is a future extension.
