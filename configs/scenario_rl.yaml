# RL scenario configuration.
#
# Reward shape is aligned with COMCOM-S-26-00430 (Section 4.5), adapted
# to a binary action space (DPDK vs USR; horizontal scaling is left for
# a later phase) and to a soft cooldown (the paper uses a hard guard).
#
# This file is consumed by two consumers:
#   1. The RL side (reward weights, observation parameters, training).
#   2. The UpfDigitalTwin's `DigitalTwin` class, which expects nested
#      `traffic`, `upf`, and `upf_switching` blocks. Keeping a single
#      file avoids drift between the two views of "the scenario".

seed: 42

traffic:
  service: "Netflix"        # must match forecast_eval_summary.json "service"
  selected_k: 10            # must match the K of the forecaster arrays (N,H,K)
  time_step_minutes: 15
  # Gbps per 1.0 of the forecaster's summed dl_norm output.
  #
  # DECLARED MODELLING ASSUMPTION (not a recovered scaler). NetMob traffic is
  # dimensionless by construction (privacy-preserving) and the forecaster sums
  # per-BS dl_norm across each cluster, so there is no physical scaler to look
  # up. alpha=1.0 interprets one summed-dl_norm unit as 1 Gbps of offered UPF
  # load. This places the K=10 clusters at mean 0.06–1.66 Gbps and peaks up to
  # 5.8 Gbps — a realistic per-site MEC-UPF operating range in which the USR
  # realisation is QoS-safe ~29% of steps, i.e. DPDK is the frequent-but-not-
  # always correct default. This is the regime all reported results assume.
  alpha: 1.0

upf:
  qos_budget:
    # Twin's binary `is_safe` thresholds. The reward no longer uses
    # `is_safe` directly; instead it uses a continuous QoS score
    # derived from `delay_us` and `predicted_loss` against these
    # budgets. They are still used as the normalisation base for that
    # score, so the values here matter.
    delay_budget_us: 200.0
    max_loss_pkts_per_interval: 5.0

upf_switching:
  accounting: "sub_step"
  prewarm:
    enabled: false
    standby_power_watts: 0.0

# Initial UPF at episode start. Must be "DPDK" or "USR".
initial_action: "DPDK"

# Discrete action space exposed by SingleSiteUPFEnv.
# Informational; the env hard-codes the same mapping.
action_space:
  type: "Discrete"
  n: 2
  mapping:
    0: "DPDK"
    1: "USR"

# Reward — paper-aligned (COMCOM-S-26-00430, Section 4.5). The
# switching-cost term is physics-grounded and attributed to L_SW
# (cost-of-action), not to SEC (steady-state efficiency):
#
#   SEC_t      = composite.power_watts / max(load_mbps, eps)
#                # steady-state specific energy (W/Mbps)
#   Q_t        = min(delay_score, loss_score) in [0, 1] # from twin surrogates
#   L_QoS      = lambda_qos * max(0, tau - Q_t)         # graded QoS penalty
#   L_SW       = lambda_sw * sw_energy_wh   if realised type changed
#                0                          otherwise
#                # twin's transition energy carries DPDK/USR asymmetry
#   L_CD       = soft cooldown surcharge (our extension)
#
#   reward = -(alpha * SEC_t + L_QoS + L_SW + L_CD)
#
# Rationale (vs. previous "fold into SEC" revision):
#   * SEC measures mode efficiency only — clean credit assignment.
#   * No load-coupling: a switch at low load no longer gets amplified
#     by the 1/load term.
#   * Direction asymmetry is captured by sw_energy_wh itself (the twin
#     gives different values for DPDK->USR vs USR->DPDK), so the flat
#     c_dpdk / c_usr constants are gone.
#
# Magnitudes (calibrated to keep magnitudes comparable to the prior
# revision at ~100 Mbps load):
#   - per-step DPDK SEC contribution ~0.6-0.8 reward at typical load.
#   - safe-USR SEC contribution      ~0.3-0.5 — USR saves ~0.3/step.
#   - QoS penalty bites at up to lambda_qos * tau = 27 if Q -> 0.
#   - DPDK switch (sw_energy_wh ~0.25 Wh from twin) at lambda_sw=4.0
#     contributes ≈1 reward unit on the switch step (load-independent).
#   - USR switch (sw_energy_wh ~0.03 Wh) contributes ≈0.12 reward units.
# lambda_sw is a tunable; sweep it if switch frequency looks off.
reward_weights:
  alpha:         100.0    # SEC scaler (paper Table 3: 100)
  lambda_qos:    30.0     # QoS penalty weight (paper: 30)
  tau:           0.90     # QoS compliance target (paper: 0.9)
  lambda_sw:     4.0      # switching-energy weight (multiplies sw_energy_wh, Wh)
  cooldown_period: 4      # minimum-dwell window, in 15-min steps
  cooldown_cost:   0.5    # extra penalty for switching inside the window

# Shared fleet-level power budget — couples cluster decisions to motivate
# MAPPO over IPPO. Applied only by the multi-site / multi-agent wrappers;
# single-site env ignores this block. When `power_cap_w` is null, the
# pool is disabled and behaviour matches prior MAPPO runs exactly.
#
# Soft-penalty form (first cut):
#   P_total = sum over k of composite.power_watts_steady at step t
#   overrun = max(0, P_total - power_cap_w)        # Watts
#   L_pool  = lambda_pool * overrun                # subtracted from reward
# Multi-site: L_pool subtracted from the load-weighted joint reward.
# Multi-agent: L_pool / K subtracted from each agent's per-step reward
# (uniform distribution — let the centralised critic handle credit).
pool:
  power_cap_w:   null     # null = disabled. Float = fleet-wide steady-state W cap.
  lambda_pool:   0.05     # penalty weight per Watt of overrun
  enforce:       "soft"   # "soft" only for now; "projection" planned next

# Integrated energy budget (telecom-realistic). The total fleet energy
# consumed over the episode is capped in Wh; the policy can "bank"
# savings at low-load periods (USR cheap) to spend at high-load periods
# (DPDK cheaper than USR). Penalty is applied per step in proportion to
# how far cumulative consumption is above a linearly-pacing target.
#
# Per step t:
#   E_cum_t      = sum_{s=1..t} P_steady_s * step_h           # Wh consumed so far
#   E_target_t   = budget_wh * t / T                          # linear-pace target
#   excess_t     = max(0, E_cum_t - E_target_t)               # Wh "ahead of pace"
#   L_budget_t   = lambda_budget * excess_t                   # reward penalty this step
budget:
  budget_wh:     null     # null = disabled. Float = total fleet Wh allowed per episode.
  lambda_budget: 0.02     # penalty weight per Wh of running excess (per step)

# Observation construction. Matches the paper's "history-augmented"
# schema (Section 4.3) — current load + the last W actual loads +
# 1-step forecast + minimal deployment context. Multi-step forecast
# is intentionally NOT used: we decide for one step at a time.
observation:
  history_window: 8       # number of past actual loads to include

# Training placeholders. The trainer CLI overrides these.
training:
  total_timesteps: 200000
  n_envs: 1
  algorithm: "PPO"

notes: |
  Binary single-site env. Reward & observation are aligned with the
  paper's design adapted to a binary action space. Multi-instance
  scaling (paper's k > 1 USR) is a future extension.
