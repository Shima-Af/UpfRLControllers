# Paths to digital twin artifacts.
#
# Most files here come from two upstream pipelines:
#   - UpfTrafficForecaster (Netflix service, K=10 currently)
#   - UpfProfilingCampaign
#
# They land under data/external/ via two mechanisms:
#   1. `dvc pull` for files that are tracked in those pipelines' S3 remotes
#      (see `.dvc/config` and the `.dvc` import files under data/external/).
#   2. `python scripts/bootstrap_external_data.py` for files that exist
#      only as local pipeline byproducts upstream (predictions/targets) or
#      hand-authored configs (switching_costs.yaml).
#
# All paths below are relative to the repository root.

traffic_forecaster:
  dir: data/external/traffic_forecaster
  # Per-split arrays from the forecaster's chronological train/val/test
  # split (~50 / ~10.5 / ~10.5 days). All three are emitted by the
  # `evaluate_forecast` stage upstream.
  predictions_train: data/external/traffic_forecaster/predictions_train.npy
  targets_train: data/external/traffic_forecaster/targets_train.npy
  predictions_val: data/external/traffic_forecaster/predictions_val.npy
  targets_val: data/external/traffic_forecaster/targets_val.npy
  predictions_test: data/external/traffic_forecaster/predictions_test.npy
  targets_test: data/external/traffic_forecaster/targets_test.npy
  # Legacy aliases (kept so older callers without an explicit `split=`
  # argument still resolve to the test slice as before).
  predictions: data/external/traffic_forecaster/predictions_test.npy
  targets: data/external/traffic_forecaster/targets_test.npy
  cluster_series: data/external/traffic_forecaster/cluster_series.npy
  cluster_assignments: data/external/traffic_forecaster/cluster_assignments.parquet
  cluster_bs_map: data/external/traffic_forecaster/cluster_bs_map.json
  bs_locations: data/external/traffic_forecaster/bs_locations.parquet
  forecast_eval_summary: data/external/traffic_forecaster/forecast_eval_summary.json

profiling_twin:
  dir: data/external/profiling_twin
  params: data/external/profiling_twin/params.yaml
  manifest: data/external/profiling_twin/models/manifest.json
  models: data/external/profiling_twin/models
  switching_costs: data/external/profiling_twin/switching_costs.yaml
